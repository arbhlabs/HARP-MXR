name: release
# Keeps the Releases page current. On every push to main, if the version in MixDock.csproj has no release yet,
# the Windows build is tested, published and attached to a new GitHub Release (tag v<version>).
# Pushing a v* tag by hand, or running this workflow by hand, does the same for that commit.
# Windows is the only released platform; macOS and Linux are built in ci.yml only, never attached here.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' windows/src/MixDock/MixDock.csproj | head -n 1)
          fi
          [ -n "$VERSION" ] || { echo "no version found"; exit 1; }
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then RELEASE=false; else RELEASE=true; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "version $VERSION, release needed: $RELEASE"

  windows:
    needs: plan
    if: needs.plan.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults: { run: { working-directory: windows, shell: pwsh } }
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - name: Unit test suites
        run: |
          foreach ($t in 'Dsp','Gamepad','Waveform','Pad','Sync','Routing','AudioTiming','Remote') {
            dotnet run --project "tests/MixDock.${t}Tests/MixDock.${t}Tests.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "$t tests failed" }
          }
      - name: Publish self-contained win-x64
        run: |
          $num = ($env:VERSION -split '-')[0]
          dotnet publish src/MixDock/MixDock.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:DebugType=none -p:Version=$env:VERSION -p:FileVersion="$num.0" -o out/MixDock
          Copy-Item ../LICENSE out/MixDock/
          Compress-Archive -Path out/MixDock/* -DestinationPath "../HARP-MXR-$env:VERSION-windows-x64.zip"
          (Get-FileHash "../HARP-MXR-$env:VERSION-windows-x64.zip" -Algorithm SHA256).Hash + "  HARP-MXR-$env:VERSION-windows-x64.zip" | Out-File "../HARP-MXR-$env:VERSION-windows-x64.zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 'HARP-MXR-*-windows-x64.zip*', if-no-files-found: error }

  publish:
    needs: [plan, windows]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true }
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh release create "v$VERSION" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HARP//MXR v$VERSION (Windows)" --generate-notes --latest
